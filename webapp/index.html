<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a0a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="커피 룰렛">
    <title>죽음의 커피 룰렛</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 스플래시 (인트로) -->
    <div id="screen-intro" class="screen active">
        <canvas id="intro-canvas"></canvas>
        <div class="intro-overlay">
            <h1 class="intro-title">죽음의<br>커피 룰렛</h1>
            <p class="intro-subtitle pulse">☠️ 탭하여 시작 ☠️</p>
            <span class="intro-version">v1.1.0</span>
        </div>
    </div>

    <!-- 멤버 선택 -->
    <div id="screen-member" class="screen">
        <div class="member-header">
            <h2>👥 참가자 등록</h2>
            <p class="member-desc">커피값을 낼 불쌍한 영혼을 추가하세요</p>
        </div>
        <div class="member-input-area">
            <input type="text" id="name-input" placeholder="이름 입력..." maxlength="10">
            <button id="add-btn" class="btn-add">추가</button>
        </div>
        <div id="member-list" class="member-list"></div>
        <div class="member-footer">
            <span id="member-count" class="member-count">참가자: 0명</span>
            <button id="start-game-btn" class="btn-start" disabled>🔫 게임 시작!</button>
        </div>
    </div>

    <!-- 게임 -->
    <div id="screen-game" class="screen">
        <canvas id="game-canvas"></canvas>
    </div>

    <!-- 결과 -->
    <div id="screen-result" class="screen">
        <canvas id="result-canvas"></canvas>
        <div class="result-overlay">
            <div class="result-badge">☠️ 당첨 ☠️</div>
            <div id="result-name" class="result-name"></div>
            <p class="result-message">커피값은 당신이 쏩니다!</p>
            <button id="retry-btn" class="btn-retry">🔄 다시 하기</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js');
        }
    </script>
</body>
</html>
